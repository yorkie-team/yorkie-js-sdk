name: Github Page Publish
on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'test/**'

# Nothing by default; the job below names what it needs.
permissions: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # The site is served from the gh-pages branch, so publishing it is a push.
    permissions:
      contents: write # checkout, and the gh-pages push by actions-gh-pages
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No cache: any job on main, the agent's included, can write entries.

      - name: Install Dependencies
        run: pnpm install

      - name: Build 🔧
        run: |
          pnpm sdk build
          pnpm sdk build:docs
          pnpm build:examples
          pnpm sdk build:ghpages

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/sdk/ghpages
          enable_jekyll: false
