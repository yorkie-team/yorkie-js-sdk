# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache pnpm store
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install

      - name: Lint
        run: pnpm lint:check

      - name: Verify documentation links
        run: pnpm verify:doc-links

      - name: Verify licence headers
        run: pnpm verify:license

      - name: Test the scripts
        run: pnpm test:scripts

      # Warns (never fails) on a finished task record still in
      # docs/tasks/active/: one this PR ticked off without archiving, or one
      # whose issue is closed / PR merged. The maintainer runs the same check
      # with --strict before merging; see .claude/skills/maintainer-merge.
      - name: Check task records
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git fetch --no-tags --deepen=200 origin "${{ github.base_ref }}" HEAD
          node scripts/tasks-check.mjs --base "origin/${{ github.base_ref }}" --remote

      - name: Build and Test SDK
        run: |
          pnpm sdk build
          docker compose -f docker/docker-compose-ci.yml up --build -d
          pnpm sdk test:ci
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Test ProseMirror
        run: pnpm prosemirror test

      - name: Build Examples
        run: pnpm build:examples

      - name: Build React and Test React
        run: |
          pnpm react build
          pnpm react test

      - name: Build and Test Schema
        run: |
          pnpm schema build
          pnpm schema test

      - name: Build and Typecheck Devtools
        env:
          # Parcel's thread worker backend is unreliable on CI runners; the
          # publish workflow pins the process backend for the same build.
          PARCEL_WORKER_BACKEND: process
        run: |
          pnpm devtools typecheck
          pnpm devtools test
          pnpm devtools build

      - name: Run benchmark
        run: pnpm sdk test:bench
