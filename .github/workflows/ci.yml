# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          # The task-record check diffs against the base branch, which a
          # shallow clone cannot reach a merge base for.
          fetch-depth: 0
          # This job runs the pull request's own code (pnpm install, lint,
          # the scripts). Nothing after checkout needs git credentials -- the
          # base-branch fetch below is of a public branch -- so do not leave
          # the token in .git/config for that code to read, as every other
          # workflow here already does.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache pnpm store
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install

      - name: Lint
        run: pnpm lint:check

      - name: Verify documentation links
        run: pnpm verify:doc-links

      - name: Verify licence headers
        run: pnpm verify:license

      - name: Test the scripts
        run: pnpm test:scripts

      # Warns (never fails) on a finished task record still in
      # docs/tasks/active/: one this PR ticked off without archiving, or one
      # whose issue is closed / PR merged. The maintainer runs the same check
      # with --strict before merging; see .claude/skills/maintainer-merge.
      - name: Check task records
        if: github.event_name == 'pull_request'
        # A warning check; it must not turn the whole job red. No token and
        # no --remote here: this step runs the pull request's own copy of the
        # script, so a credential in its environment (or, without
        # persist-credentials: false above, in .git/config) would be handed to
        # branch-authored code. The remote half is the maintainer's, before
        # the merge (see .claude/skills/maintainer-merge).
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `|| true`: a fetch failure must still reach the checker, which
          # reports "could not diff" instead of being skipped under `set -e`.
          git fetch --no-tags origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
          node scripts/tasks-check.mjs --base "origin/$BASE_REF"

      - name: Build and Test SDK
        run: |
          pnpm sdk build
          docker compose -f docker/docker-compose-ci.yml up --build -d
          pnpm sdk test:ci
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
        env:
          # This job has already run the pull request's own code (pnpm
          # install, tests). Hand the upload token to pushes to main only;
          # pull requests upload tokenless, and the action does not fail CI
          # when an upload is refused.
          CODECOV_TOKEN: ${{ github.event_name == 'push' && secrets.CODECOV_TOKEN || '' }}

      - name: Test ProseMirror
        run: pnpm prosemirror test

      - name: Build Examples
        run: pnpm build:examples

      - name: Build React and Test React
        run: |
          pnpm react build
          pnpm react test

      - name: Build and Test Schema
        run: |
          pnpm schema build
          pnpm schema test

      - name: Build and Typecheck Devtools
        env:
          # Parcel's thread worker backend is unreliable on CI runners; the
          # publish workflow pins the process backend for the same build.
          PARCEL_WORKER_BACKEND: process
        run: |
          pnpm devtools typecheck
          pnpm devtools test
          pnpm devtools build

      - name: Run benchmark
        run: pnpm sdk test:bench
