name: npm-publish
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build:
    # NOT FOR A RELEASE THE AGENT APP CREATED. `contents: write` is one
    # permission covering commits AND releases, so the token the fix agents hold
    # to push a branch can also publish a release — and this job answers that
    # with `NPM_TOKEN`. There is no narrower grant to ask for, so the check sits
    # at the consumer. Nothing legitimate publishes a release as the App, so it
    # costs nothing. It is not the whole answer: a `release` event runs the
    # workflow file at the TAGGED commit, which the App could point at one that
    # predates this line, and it can publish a draft a human created. Putting
    # the publish secrets behind a reviewed environment, or a `v*` tag ruleset,
    # closes those. Same guard as yorkie-team/yorkie's
    # docker-publish.yml; scripts/agent/checks.test.mjs pins it.
    if: github.event.release.author.login != 'yorkie-team-agent[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Cache pnpm store
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install

      - name: SDK Build
        run: pnpm sdk build
      - name: SDK Publish
        run: pnpm publish --filter=@yorkie-js/sdk --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: React Build
        run: pnpm react build
      - name: React Publish
        run: pnpm publish --filter=@yorkie-js/react --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Schema Build
        run: pnpm schema build
      - name: Schema Publish
        run: pnpm publish --filter=@yorkie-js/schema --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: ProseMirror Build
        run: pnpm prosemirror build
      - name: ProseMirror Publish
        run: pnpm publish --filter=@yorkie-js/prosemirror --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
