# The toolchain an agent job needs before it can verify a change in THIS
# repository. One of the per-repository files of the agent harness: the
# `agent-*.yml` workflows are the same in every repository that runs the
# harness, and each calls this action where it used to carry the setup steps
# inline (scripts/agent/README.md, "The toolchain action").
#
# IT RUNS WITH A TOKEN IN THE ENVIRONMENT AND AN UNTRUSTED BRANCH IN THE
# WORKSPACE. In the fix jobs the workspace is the pull request's branch and an
# App token is already minted, so nothing here may execute what the branch
# wrote. A plain `pnpm install` is exactly that: the lifecycle scripts of every
# workspace package.json (the SDK's `prepare` alone runs a full build) and of
# every dependency the branch's lockfile names, plus a `.pnpmfile.cjs` hook if
# the branch adds one. Hence `--ignore-scripts` and `--ignore-pnpmfile`, and
# `--frozen-lockfile` so the install is exactly what the lockfile pins.
# `pnpm verify:fast` needs no install script: the SDK build is one of its own
# steps. The callers take this file from `main`, never from the branch
# (config-wiring.test.mjs holds them to it).
#
# This does not stop the AGENT running branch code — it has to, to verify, and
# it holds the token by design because it has to push. What must not happen is
# the job reaching the agent having already run the branch's build files for
# its own convenience.
#
# NODE IS NOT SET UP HERE. Every job that calls this action has already run
# `actions/setup-node` for the harness scripts, with the Node `ci.yml`'s build
# job uses, and without a cache.
#
# NO CACHE: no `cache:` on any step and no actions/cache. A cache post step
# would SAVE the pnpm store after the agent ran, with whatever the agent left
# there, under a key the agent controls through `pnpm-lock.yaml` — and a cache
# saved by a run in the default branch's context (`issue_comment`,
# `workflow_run`) is one `ci.yml` and the npm publish can restore.
#
# `.github/agent-harness/repo.test.mjs` pins all of this: the action-setup
# commit, the pnpm major against `ci.yml`, the install flags, no cache, and
# `npmrc` here against the root `.npmrc`.
name: Agent toolchain
description: pnpm and the workspace dependencies an agent job verifies with, installed without running anything from the working tree.
runs:
  using: composite
  steps:
    # The pnpm major is pinned here, as `ci.yml` pins it, rather than read from
    # a `packageManager` field the branch could add. The action is pinned to a
    # commit: a moved tag would run with this job's tokens.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 9
    - name: Install dependencies (lockfile-exact, no lifecycle scripts)
      shell: bash
      # THE BRANCH'S .npmrc IS NOT READ. The flags below stop scripts and
      # pnpmfiles, but not PATH settings: a branch `.npmrc` with
      # `modules-dir=../..` makes the install write a branch-supplied package
      # outside the workspace — over the `node` a later step runs, with the
      # credential pool in its environment. So every `.npmrc` the branch
      # carries is set aside, `main`'s (the `@buf` registry) stands in for
      # the install, and the location and version settings are pinned on
      # the command line as well. The branch's files are put back before the
      # agent runs, so its working tree is what the branch holds.
      #
      # MAIN'S .npmrc IS THE COPY BESIDE THIS FILE (`npmrc`, without the dot,
      # so the sweep below never sets it aside). This action's directory is
      # all a caller checks out from `main` — a sparse checkout into
      # `.trusted-toolchain` — so the root `.npmrc` is not there to read, and
      # the workspace's own is the branch's. `$GITHUB_ACTION_PATH` is where
      # the runner loaded this action from, so the copy has the same
      # provenance as these lines.
      run: |
        set -euo pipefail
        trusted="$GITHUB_ACTION_PATH/npmrc"
        if [ ! -f "$trusted" ] || [ -L "$trusted" ]; then
          echo "::error::the toolchain action's npmrc is missing beside action.yml" >&2
          exit 1
        fi
        stash=$(mktemp -d)
        find . -name .npmrc -not -path '*/node_modules/*' -print0 |
          while IFS= read -r -d '' f; do
            mkdir -p "$stash/$(dirname "$f")"
            mv "$f" "$stash/$f"
          done
        cp "$trusted" .npmrc
        pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile \
          --config.manage-package-manager-versions=false \
          --config.modules-dir=node_modules \
          --config.virtual-store-dir=node_modules/.pnpm
        rm .npmrc
        (cd "$stash" && find . -name .npmrc -print0) |
          while IFS= read -r -d '' f; do mv "$stash/$f" "$f"; done
