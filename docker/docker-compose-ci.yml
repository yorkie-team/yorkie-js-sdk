name: yorkie-js-sdk

services:
  yorkie:
    image: "yorkieteam/yorkie:latest"
    command:
      [
        "server",
        "--mongo-connection-uri",
        "mongodb://mongo:27017",
      ]
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - mongo
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mongo:
    image: "mongo:latest"
    restart: always
    ports:
      - "27017:27017"
