name: yorkie-js-sdk

services:
  yorkie:
    # The server is a replica: it applies operations and builds the snapshots
    # clients restore from, so a convergence rule changed here has to be
    # running in this image before the change can ship. #1433 is waiting on
    # that -- yorkie-team/yorkie#2098 is still open, no release carries it,
    # and until one does this pin has to move onto that tag (see
    # docs/tasks/active/20261002-further-split-after-same-boundary-todo.md).
    image: "yorkieteam/yorkie:latest"
    command:
      [
        "server",
        "--mongo-connection-uri",
        "mongodb://mongo:27017",
      ]
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - mongo
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mongo:
    image: "mongo:8"
    restart: always
    ports:
      - "27017:27017"
