name: yorkie-js-sdk

services:
  yorkie:
    image: "yorkieteam/yorkie:latest"
    command:
      [
        "server",
        "--mongo-connection-uri",
        "mongodb://mongo:27017",
      ]
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mongo:
    image: "mongo:8"
    restart: always
    ports:
      - "27017:27017"
    # `up --wait` in CI waits on this, so a MongoDB that never starts fails the
    # step at once instead of every test timing out on its connection.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
