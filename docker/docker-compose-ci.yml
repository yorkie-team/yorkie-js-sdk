name: yorkie-js-sdk

services:
  yorkie:
    image: "yorkieteam/yorkie:latest"
    command:
      [
        "server",
        "--mongo-connection-uri",
        "mongodb://mongo:27017",
      ]
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - mongo
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mongo:
    # 8.x refuses to boot on Linux 6.19+ (SERVER-121912), which is what the
    # CI runners now report, so the server never gets a database and every
    # suite fails at the wait-for-yorkie gate. 9.x carries the fix.
    image: "mongo:9"
    restart: always
    ports:
      - "27017:27017"
